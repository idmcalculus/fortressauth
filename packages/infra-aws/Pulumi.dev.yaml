config:
  aws:region: eu-west-1
  # Refuse to plan or apply against the wrong AWS account.
  fortressauth-aws:expectedAccountId: '552072248716'
  # Application
  fortressauth-aws:appDomain: dev-api.fortressauth.com
  fortressauth-aws:frontendBaseUrl: https://fortressauth.com
  fortressauth-aws:cookieSameSite: lax
  fortressauth-aws:csrfCookieSameSite: lax
  # Container
  fortressauth-aws:appImage: 552072248716.dkr.ecr.eu-west-1.amazonaws.com/fortressauth-dev/server:bootstrap
  fortressauth-aws:taskCpu: "256"
  fortressauth-aws:taskMemoryMib: "512"
  # Bootstrap order:
  #   1. Set desiredCount: 0 for the first `pulumi up` to create ECR, ALB,
  #      RDS, etc. without trying to start tasks.
  #   2. Build and push the real FortressAuth image to the ECR repository
  #      that the first apply created.
  #   3. Set fortressauth-aws:appImage to the real ECR digest and bump
  #      desiredCount to 1, then `pulumi up` again to roll the service.
  # The deploy-aws GitHub workflow does steps 2 and 3 automatically.
  fortressauth-aws:desiredCount: "1"
  fortressauth-aws:containerPort: "3000"
  fortressauth-aws:logRetentionDays: "14"
  # Database
  fortressauth-aws:dbName: fortressauth
  fortressauth-aws:dbUser: fortressauth
  fortressauth-aws:dbInstanceClass: db.t4g.micro
  fortressauth-aws:dbAllocatedStorageGb: "20"
  fortressauth-aws:dbBackupRetentionDays: "1"
  fortressauth-aws:dbMultiAz: "false"
  fortressauth-aws:dbDeletionProtection: "false"
  fortressauth-aws:dbSkipFinalSnapshot: "true"
  fortressauth-aws:dbPostgresVersion: '17.10'
  # Email (SES). The domain identity is provisioned outside Pulumi via
  # console/CLI in eu-west-1 (DKIM + SPF + DMARC + custom MAIL FROM). This
  # stack only manages the configuration set and SNS topic.
  fortressauth-aws:sesIdentityDomain: fortressauth.com
  fortressauth-aws:sesFromAddress: noreply@fortressauth.com
  fortressauth-aws:sesFromName: FortressAuth (dev)
  fortressauth-aws:sesReplyToAddress: noreply@fortressauth.com
  fortressauth-aws:bounceNotificationEmail: damilola.ige+ses-bounces-dev@jaydeetechltd.com
  fortressauth-aws:sesManageIdentity: "false"
  # Network
  fortressauth-aws:vpcCidr: 10.30.0.0/16
  fortressauth-aws:availabilityZones: "2"
  # Bootstrap mode creates the ACM certificate and outputs DNS validation
  # CNAMEs, but skips the HTTPS listener. Add those CNAMEs in external DNS
  # and flip this to false once ACM validation can complete.
  fortressauth-aws:bootstrap: "false"
  # App env
  fortressauth-aws:appEnv:
    EMAIL_PROVIDER: console
    BREACHED_PASSWORD_CHECK: 'true'
    CORS_ORIGINS: https://fortressauth.com,https://react-demo.fortressauth.com,http://localhost:3000,http://localhost:3001,http://localhost:5173,http://localhost:5174
    NATIVE_CLIENTS_JSON: '[{"clientId":"wraith","redirectUris":["wraith://auth/callback"]}]'
    GOOGLE_REDIRECT_URI: https://dev-api.fortressauth.com/auth/oauth/google/callback
    APPLE_REDIRECT_URI: https://dev-api.fortressauth.com/auth/oauth/apple/callback
    # Before preview/deploy, configure at least one complete provider. These are
    # public identifiers; never put its client secret in appEnv.
    # GOOGLE_CLIENT_ID: replace-with-dev-google-client-id
    # APPLE_CLIENT_ID: replace-with-dev-apple-services-id
    # APPLE_TEAM_ID: replace-with-apple-team-id
    # APPLE_KEY_ID: replace-with-apple-key-id
  # Names of secret env vars Pulumi should provision in Secrets Manager.
  # Values are populated post-deploy via `aws secretsmanager put-secret-value`.
  fortressauth-aws:secretEnvKeys:
    - RESEND_API_KEY
    - GOOGLE_CLIENT_SECRET
    - GITHUB_CLIENT_SECRET
    - APPLE_CLIENT_SECRET
    - DISCORD_CLIENT_SECRET
    - LINKEDIN_CLIENT_SECRET
    - TWITTER_CLIENT_SECRET
    - MICROSOFT_CLIENT_SECRET
