name: Deploy Oracle

# Builds the server image for linux/arm64 on a native arm64 runner, pushes it
# to GHCR, then rolls it out to the Oracle Cloud VM over SSH. One-time setup
# (VM, GitHub environment, secrets) is in deploy/oracle/README.md.
#
# Automatic deploys after CI passes on main stay off until the repository
# variable ORACLE_DEPLOY_ENABLED is "true". Manual runs always go ahead.

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-oracle
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/fortressauth-server
  APP_DIR: /opt/fortressauth

jobs:
  build:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        vars.ORACLE_DEPLOY_ENABLED == 'true' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main'
      )
    # Native arm64 runner, free for public repositories. The native modules
    # (better-sqlite3, @node-rs/argon2) build without QEMU emulation.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
      sha: ${{ steps.ref.outputs.sha }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: >-
            ${{
              github.event_name == 'workflow_run'
                && github.event.workflow_run.head_sha
                || github.sha
            }}

      - name: Resolve deployment ref
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >>"${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push arm64 image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ env.IMAGE_NAME }}:sha-${{ steps.sha.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.sha.outputs.sha }}
          cache-from: type=gha,scope=deploy-oracle
          cache-to: type=gha,mode=max,scope=deploy-oracle

      - name: Record image reference
        id: ref
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          echo "image=${IMAGE_NAME}@${DIGEST}" >>"${GITHUB_OUTPUT}"
          echo "sha=${SHA}" >>"${GITHUB_OUTPUT}"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: oracle-prod
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.build.outputs.sha }}

      - name: Validate deployment config
        env:
          ORACLE_SSH_HOST: ${{ vars.ORACLE_SSH_HOST }}
          ORACLE_SSH_USER: ${{ vars.ORACLE_SSH_USER }}
          ORACLE_APP_URL: ${{ vars.ORACLE_APP_URL }}
          ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          ORACLE_SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          missing=0
          for var in ORACLE_SSH_HOST ORACLE_SSH_USER ORACLE_APP_URL ORACLE_SSH_PRIVATE_KEY ORACLE_SSH_KNOWN_HOSTS; do
            if [ -z "${!var:-}" ]; then
              echo "Missing environment variable or secret: ${var}" >&2
              missing=1
            fi
          done
          [ "${missing}" = "0" ]

      - name: Configure SSH
        env:
          ORACLE_SSH_HOST: ${{ vars.ORACLE_SSH_HOST }}
          ORACLE_SSH_USER: ${{ vars.ORACLE_SSH_USER }}
          ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          ORACLE_SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "${ORACLE_SSH_PRIVATE_KEY}" >~/.ssh/oracle_deploy
          chmod 600 ~/.ssh/oracle_deploy
          printf '%s\n' "${ORACLE_SSH_KNOWN_HOSTS}" >~/.ssh/known_hosts
          cat >~/.ssh/config <<EOF
          Host oracle
            HostName ${ORACLE_SSH_HOST}
            User ${ORACLE_SSH_USER}
            IdentityFile ~/.ssh/oracle_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          EOF

      # Variables in the ssh commands below expand on the runner on purpose.
      - name: Copy stack files to the VM
        run: |
          set -euo pipefail
          scp -q \
            deploy/oracle/docker-compose.yml \
            deploy/oracle/Caddyfile \
            deploy/oracle/keepalive.mjs \
            deploy/oracle/deploy.sh \
            deploy/oracle/backup.sh \
            "oracle:${APP_DIR}/"
          # shellcheck disable=SC2029
          ssh oracle "chmod 750 ${APP_DIR}/deploy.sh ${APP_DIR}/backup.sh"

      # The token only lives as long as this job; the last step logs out.
      - name: Log in to GHCR on the VM
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          # shellcheck disable=SC2029
          printf '%s' "${GHCR_TOKEN}" |
            ssh oracle "docker login ghcr.io --username '${GHCR_USER}' --password-stdin"

      - name: Deploy
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          # shellcheck disable=SC2029
          ssh oracle "${APP_DIR}/deploy.sh '${IMAGE}'"

      - name: Log out of GHCR on the VM
        if: always()
        run: ssh oracle "docker logout ghcr.io" || true

      - name: Smoke test deployed app
        env:
          ORACLE_APP_URL: ${{ vars.ORACLE_APP_URL }}
        run: |
          set -euo pipefail
          curl -fsS --retry 30 --retry-all-errors --retry-delay 5 \
            "${ORACLE_APP_URL%/}/health" >/dev/null
          curl -fsS --retry 30 --retry-all-errors --retry-delay 5 \
            "${ORACLE_APP_URL%/}/openapi.json" >/dev/null
